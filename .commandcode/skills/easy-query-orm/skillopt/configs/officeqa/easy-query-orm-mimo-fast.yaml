_base_: default.yaml

train:
  num_epochs: 2
  batch_size: 12

gradient:
  minibatch_size: 4
  merge_batch_size: 4
  analyst_workers: 4
  max_analyst_rounds: 2

optimizer:
  learning_rate: 2
  min_learning_rate: 1
  slow_update_samples: 6

evaluation:
  eval_test: false

env:
