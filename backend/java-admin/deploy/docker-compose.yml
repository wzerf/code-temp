# ============================================================
# java-admin dev 依赖编排
# 位置：backend/java-admin/deploy/docker-compose.yml
# 用途：dev 期起 mysql + redis + nacos + temporal(+ui) + minio（java-admin 自身不在 compose）
# ============================================================
services:
  # ----------------------------
  # MySQL 8.4
  # ----------------------------
  mysql:
    image: mysql:8.4
    container_name: java-admin-mysql
    restart: unless-stopped
    mem_limit: ${MYSQL_MEM_LIMIT:-1024m}
    memswap_limit: ${MYSQL_MEM_LIMIT:-1024m}
    ports:
      # 与 application-dev.yml 默认 MYSQL_PORT=4336 对齐（4000 段，避开本机 3306）
      - "${MYSQL_PORT:-4336}:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-javaadmin_dev}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - java-admin-net
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------
  # Redis 7
  # ----------------------------
  redis:
    image: redis:7-alpine
    container_name: java-admin-redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    memswap_limit: ${REDIS_MEM_LIMIT:-256m}
    ports:
      # 与 application-dev.yml 默认 REDIS_PORT=4379 / password=123456 对齐
      - "${REDIS_PORT:-4379}:6379"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-123456}"
      - "--appendonly"
      - "yes"
    volumes:
      - redis_data:/data
    networks:
      - java-admin-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------
  # Nacos 2.4.3（dev：standalone + Derby 持久化 + 鉴权关闭）
  # Q11 决策：默认启动；Q10 决策：Nacos 是否被 java-admin 连接由 NACOS_CONFIG_ENABLED 控制
  # ----------------------------
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: java-admin-nacos
    restart: unless-stopped
    # JVM 已是 512m 堆，硬顶留 metaspace / 直接内存
    mem_limit: ${NACOS_MEM_LIMIT:-1024m}
    memswap_limit: ${NACOS_MEM_LIMIT:-1024m}
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: derby
      NACOS_AUTH_ENABLE: "false" # dev 关闭鉴权（prod 必须改为 true）
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    networks:
      - java-admin-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------
  # Temporal Server（auto-setup + MySQL 持久化，dev）
  # 默认 auto-setup 的 DB=cassandra，未设 CASSANDRA_SEEDS 会直接退出；
  # 此处改为 mysql8，复用本 compose 的 mysql（schema: temporal / temporal_visibility 由 auto-setup 创建）
  # 宿主机端口 4000 段：4723 → 容器 gRPC 7233
  # 启用应用侧连接：TEMPORAL_TARGET=127.0.0.1:4723
  # ----------------------------
  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: java-admin-temporal
    restart: unless-stopped
    # auto-setup 单容器默认会吃到 2G+。mem_limit 是 cgroup 硬顶；GOMEMLIMIT 约 85% 硬顶，避免直接 OOM kill。
    mem_limit: ${TEMPORAL_MEM_LIMIT:-1024m}
    memswap_limit: ${TEMPORAL_MEM_LIMIT:-1024m}
    ports:
      - "${TEMPORAL_PORT:-4723}:7233"
    environment:
      # 必须显式指定，否则默认 cassandra 并要求 CASSANDRA_SEEDS
      DB: mysql8
      DB_PORT: 3306
      MYSQL_SEEDS: mysql
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-root}
      # 监听所有接口；勿把 TEMPORAL_ADDRESS 设为 hostname（会只绑到解析出的单 IP，healthcheck 127.0.0.1 失败）
      BIND_ON_IP: "0.0.0.0"
      # 允许 auto-setup 创建/升级 schema
      SKIP_DB_CREATE: "false"
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
      GOMEMLIMIT: ${TEMPORAL_GOMEMLIMIT:-850MiB}
      GOMAXPROCS: ${TEMPORAL_GOMAXPROCS:-2}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - java-admin-net
    healthcheck:
      # auto-setup 镜像内 temporal CLI 探测 frontend
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  # ----------------------------
  # Temporal Web UI（默认与 Server 一起起）
  # 宿主机 4808 → 容器 8080；打开 http://localhost:4808
  # ----------------------------
  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: java-admin-temporal-ui
    restart: unless-stopped
    mem_limit: ${TEMPORAL_UI_MEM_LIMIT:-256m}
    memswap_limit: ${TEMPORAL_UI_MEM_LIMIT:-256m}
    ports:
      - "${TEMPORAL_UI_PORT:-4808}:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-4808}
    depends_on:
      temporal:
        condition: service_started
    networks:
      - java-admin-net

  # ----------------------------
  # Adminer（仅 --profile dev 启动）
  # ----------------------------
  adminer:
    image: adminer:latest
    container_name: java-admin-adminer
    restart: unless-stopped
    mem_limit: ${ADMINER_MEM_LIMIT:-128m}
    memswap_limit: ${ADMINER_MEM_LIMIT:-128m}
    profiles: ["dev"]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha-dark
    networks:
      - java-admin-net
    depends_on:
      mysql:
        condition: service_healthy

  # ----------------------------
  # MinIO（单机 /data；镜像钉死社区版 RELEASE.2025-04-08）
  # 宿主机 4000 段：4900 → API 9000，4901 → Console 9001
  # Console：http://127.0.0.1:4901  默认账号 minioadmin / minioadmin
  # 应用侧（本机进程）：S3 endpoint = http://127.0.0.1:4900
  # ----------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: java-admin-minio
    restart: unless-stopped
    mem_limit: ${MINIO_MEM_LIMIT:-512m}
    memswap_limit: ${MINIO_MEM_LIMIT:-512m}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-4900}:9000"
      - "${MINIO_CONSOLE_PORT:-4901}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      GOMEMLIMIT: ${MINIO_GOMEMLIMIT:-425MiB}
      # 不要设 MINIO_SERVER_URL=http://127.0.0.1:4900：Console 在容器内用该地址连 API，
      # 容器 loopback 没有 4900（API 在 :9000），登录会 503 "unable to login due to network error"。
      # 浏览器跳转由 MINIO_BROWSER_REDIRECT_URL 控制。
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://127.0.0.1:4901}
    volumes:
      - minio_data:/data
    networks:
      - java-admin-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  java-admin-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  nacos_data:
  nacos_logs:
  minio_data:
