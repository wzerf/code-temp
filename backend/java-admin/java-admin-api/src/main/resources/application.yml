spring:
  application:
    name: java-admin
  profiles:
    active: dev

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

  # ───────────────────────────────────────────────
  # Nacos Config（nacos-config-spring-boot-starter 0.2.2+）
  # ───────────────────────────────────────────────
  # 端口策略：4000 段，避开常见 dev 冲突（80xx/3306/6379/8848）
  # server-addr / username / password 放顶层，config.* 自动继承
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:4848}
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        # 与新 starter 的 spring.config.import 行为兼容
        import-check:
          enabled: false
        namespace: ${NACOS_NAMESPACE:java-admin-dev}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        # 双 dataId（Q12 决策）：共享 + dev 覆盖
        # ⚠️ kebab-case：data-id / refresh-enabled（starter metadata 真实字段名）
        extension-configs:
          - data-id: java-admin.yaml
            group: DEFAULT_GROUP
            refresh-enabled: true
          - data-id: java-admin-dev.yaml
            group: DEFAULT_GROUP
            refresh-enabled: true

  # Temporal（io.temporal:temporal-spring-boot-starter）—— 必要依赖，无本地 mock 回退
  # 文档：https://docs.temporal.io/develop/java/integrations/spring-boot-integration
  # 自动配置条件：connection.target 非空 OR test-server.enabled=true
  # 默认连本地 compose（宿主机 4723→容器 7233）；启动后全量对账 + CRUD 即时同步 Schedule
  temporal:
    connection:
      target: ${TEMPORAL_TARGET:127.0.0.1:4723}
    namespace: ${TEMPORAL_NAMESPACE:default}
    # true 时启动 Worker（需 auto-discovery 或显式 workers 配置）
    start-workers: ${TEMPORAL_START_WORKERS:false}
    # 发现 @WorkflowImpl 类 + @ActivityImpl Spring Bean（taskQueues 见实现类注解）
    workers-auto-discovery:
      workflow-packages:
        - com.wshake.infra.temporal.workflow
      register-activity-beans: true
    # Worker 优雅停机等待秒数（SmartLifecycle 在 gRPC Channel 关闭前 awaitTermination）
    # 需 ≤ spring.lifecycle.timeout-per-shutdown-phase（默认 30s）
    worker:
      shutdown-await-seconds: ${TEMPORAL_WORKER_SHUTDOWN_AWAIT_SECONDS:30}
    workers:
      - task-queue: demo
        capacity:
          # 进程内同时执行的生图 Activity 上限（≈ 同时在飞的火山 API 请求数；多图在单 Activity 内串行）
          max-concurrent-activity-executors: 1

  # SmartLifecycle 停机超时：覆盖 Temporal Worker await，避免相位超时后仍关 Channel
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:45s}

  # Nacos 启用开关（被 NacosConfigToggleProperties @ConfigurationProperties 绑定）
  # 默认 false：dev profile 不连 Nacos，prod 用 env 变量打开
  # 与 spring.cloud.nacos.config.enabled 同义
  main:
    banner-mode: off
nacos:
  config:
    enabled: ${NACOS_CONFIG_ENABLED:false}

# Sa-Token（Redis 模式：sa-token-redis-template 走 Spring Data Redis + Lettuce）
# timeout=2592000s=30天；is-share=false 同一账号多端登录各持独立 token
# token-name=Authorization + token-prefix=Bearer → 与前端/mock 的 Authorization: Bearer <accessToken> 对齐
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-print: false # 关闭启动 ASCII banner
  is-read-cookie: false
  is-read-header: true

# jcasbin（授权引擎；JDBC Adapter 连 MySQL casbin_rule 表）
casbin:
  model: casbin/model.conf
  table-name: casbin_rule
  auto-create-table: false
  remove-policy-failed: false

# ALTCHA 人机校验（与 mock 默认 secret 对齐，便于本地联调）
altcha:
  hmac-secret: ${ALTCHA_HMAC_KEY:altcha-dev-hmac-secret}
  cost: ${ALTCHA_COST:1000}
  expires-seconds: ${ALTCHA_EXPIRES_SECONDS:600}

# 请求安全中间件：Timestamp / Encrypt / Nonce / Sign / Language 独立开关；dev 默认全开
app:
  # 对象存储：local 默认；s3 对接 compose MinIO（127.0.0.1:4900）
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      base-path: ${STORAGE_LOCAL_BASE_PATH:./data/storage}
      public-base-url: ${STORAGE_LOCAL_PUBLIC_BASE_URL:}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://127.0.0.1:4900}
      region: ${STORAGE_S3_REGION:us-east-1}
      bucket: ${STORAGE_S3_BUCKET:java-admin}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      public-base-url: ${STORAGE_S3_PUBLIC_BASE_URL:}
      path-style: ${STORAGE_S3_PATH_STYLE:true}
      presign-expire-seconds: ${STORAGE_S3_PRESIGN_EXPIRE_SECONDS:900}
  # 出站 HTTP（共享 OkHttpClient，见 ADR 0005）
  http:
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:5s}
    read-timeout: ${HTTP_READ_TIMEOUT:30s}
    write-timeout: ${HTTP_WRITE_TIMEOUT:10s}
    call-timeout: ${HTTP_CALL_TIMEOUT:0s}
    pool:
      max-idle-connections: ${HTTP_POOL_MAX_IDLE:5}
      keep-alive: ${HTTP_POOL_KEEP_ALIVE:5m}
  # Agent 只读运行路径；密钥仅由部署环境提供，绝不写入 Revision 或数据库。
  agent-runtime:
    enabled: ${AGENT_RUNTIME_ENABLED:false}
    model-name: ${AGENT_RUNTIME_MODEL_NAME:}
    base-url: ${AGENT_RUNTIME_BASE_URL:}
    api-key: ${AGENT_RUNTIME_API_KEY:}
    request-id-ttl: ${AGENT_RUNTIME_REQUEST_ID_TTL:10m}
    execution-lease: ${AGENT_RUNTIME_EXECUTION_LEASE:10m}
    model-timeout: ${AGENT_RUNTIME_MODEL_TIMEOUT:2m}
  agent-skill:
    database-name: ${AGENT_SKILL_DATABASE_NAME:}
  # 平台墙钟（仅 Asia/Shanghai，见 ADR 0004）
  time:
    zone: Asia/Shanghai
  security:
    timestamp:
      enabled: ${SECURITY_TIMESTAMP_ENABLED:true}
      expire-ms: ${SECURITY_TIMESTAMP_EXPIRE_MS:300000}
    encrypt:
      enabled: ${SECURITY_ENCRYPT_ENABLED:false}
    nonce:
      enabled: ${SECURITY_NONCE_ENABLED:true}
    sign:
      enabled: ${SECURITY_SIGN_ENABLED:true}
    language:
      enabled: ${SECURITY_LANGUAGE_ENABLED:true}
    # Encrypt/Sign 安全中间件白名单（免强制加密与独立签名校验）
    # 含 /webjars/** /swagger-resources/** /csrf，否则 doc.html 加载的静态资源会被拦截
    whitelist:
      - /.well-known/**
      - /api/encrypt/public/key
      - /api/encrypt/dev/key-pair
      - /api/encrypt/dev/session-key
      - /api/altcha/**
      - /api/public/i18n/**
      - /doc.html
      - /doc.html/**
      - /swagger-ui/**
      - /swagger-resources/**
      - /v3/api-docs/**
      - /webjars/**
      - /favicon.ico
      - /csrf
      - /error
      - /actuator/**
      - /api/health/**
    # Sa-Token 认证拦截器排除路径
    auth-exclude-paths:
      - /api/auth/login
      - /api/auth/logout
      - /api/altcha/challenge
      - /api/encrypt/public/key
      - /api/public/i18n/**
      - /api/encrypt/dev/key-pair
    # jcasbin 授权拦截器排除路径（认证排除 + 文档/静态资源）
    casbin-exclude-paths:
      - /.well-known/**
      - /api/auth/login
      - /api/auth/logout
      - /api/altcha/challenge
      - /api/encrypt/public/key
      - /api/public/i18n/**
      - /api/encrypt/dev/key-pair
      - /doc.html
      - /doc.html/**
      - /swagger-ui/**
      - /swagger-resources/**
      - /v3/api-docs/**
      - /webjars/**
      - /favicon.ico
      - /csrf
      - /error

# Easy-Query 3.x（SQL-springboot4-starter 适配 SB 4）
# name-conversion: underlined → entity 字段 userId 自动映射列 user_id
easy-query:
  enable: true
  database: mysql
  name-conversion: underlined
  defaultDataSourceMergePoolSize: 16

server:
  port: ${APP_PORT:4080}
  servlet:
    context-path: /
  # 反向代理后还原客户端 IP / 协议（Tomcat RemoteIpValve）
  # 仅当 remoteAddr 匹配 internal-proxies 时才信任 X-Forwarded-*，降低头伪造风险
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      # RFC1918 内网代理段（与文章推荐一致；部署在特殊网段时可覆盖）
      internal-proxies: "192\\.168\\.\\d{1,3}\\.\\d{1,3}|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}"

logging:
  level:
    root: INFO
    com.wshake: INFO
    com.wshake.infra.temporal.workflow.ExecutionMirrorTickActivitiesImpl: WARN
    com.wshake.infra.temporal.workflow.ExecutionMirrorTickWorkflowImpl: WARN
    com.easy.query: WARN
